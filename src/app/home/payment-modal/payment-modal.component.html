<ion-header class="bar-stable bg-trans bar bar-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-buttons slot="start">
        <!-- <ion-menu-button></ion-menu-button> -->
        <ion-icon name="arrow-back-outline" (click)="close()"></ion-icon>
      </ion-buttons>
    </ion-buttons>
    <ion-title class="center"><img alt="" src="assets/images/logo.png"></ion-title>
    <ion-buttons slot="end">
      <!-- <ion-button  (click)="close()">   back        </ion-button> -->
    </ion-buttons>
  </ion-toolbar>
</ion-header>

  <div class="message-container">
    <h1 class="message">
      We thank you for allowing Shawnee Environmental Services to serve you for the last 22 years.
    </h1>
    <p class="message">
      No additional training can be purchased and taken at this time.
    </p>

    <p class="message">
      <b>
      Please download your pdf Training Report for your records.</b>

    <ion-button color="white" expand="block" class="create"  (click)="redirectToTrainingReport()">

  </div>
